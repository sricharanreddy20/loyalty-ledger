# db (PostgreSQL 16), backend (FastAPI) and frontend (static page on nginx).
# Open http://localhost:8080 for the page and http://localhost:8000/docs for the API.
# Data is loaded from the host: python -m generator --scale starter --load
services:
  db:
    image: postgres:16-alpine
    env_file: .env
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # schema.sql runs once, on first start of an empty volume.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      # inside the compose network the database is "db" on its normal port
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    image: nginx:1.27-alpine
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    volumes:
      # static files only; the page calls the backend from the browser (config.js)
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend

volumes:
  pgdata:
